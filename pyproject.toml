[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project]
name = "opcua-client"
version = "0.9.0"
description = "OPC-UA Client GUI"
authors = [{ name = "Olivier R-D" }]
license = { text = "GNU General Public License" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncua",
    "numpy>=1.24.4",
    "PyQt5",
    "pyqtgraph>=0.14.0",
]
keywords = ["opcua", "client", "gui", "industrial", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/FreeOpcUa/opcua-client-gui"
Repository = "https://github.com/FreeOpcUa/opcua-client-gui"
Issues = "https://github.com/FreeOpcUa/opcua-client-gui/issues"

[project.scripts]
opcua-client = "opcua_client.mainwindow:main"

[dependency-groups]
dev = [
    "opcua>=0.98.13",
    "pytest>=6.0",
    "pytest-qt",
]

[tool.ruff]
line-length = 100

[tool.uv_build]
packages = ["src"]
